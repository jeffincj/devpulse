<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevPulse — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 0 20px 80px;
    background: #05070d;
    color: #e2e8f0;
  }

  .navbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 0; border-bottom: 1px solid #1e293b; margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }

  .logo-badge {
    position: relative; width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(from 0deg, #6366f1, #22d3ee, #a855f7, #6366f1);
    animation: spinGrad 4s linear infinite;
  }
  @keyframes spinGrad { to { transform: rotate(360deg); } }
  .logo-core { width: 26px; height: 26px; border-radius: 8px; background: #05070d; display: flex; align-items: center; justify-content: center; }
  .logo-dot { width: 9px; height: 9px; border-radius: 50%; background: linear-gradient(135deg, #818cf8, #22d3ee); animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(99,102,241,0.6); }
    50% { transform: scale(1.35); box-shadow: 0 0 0 7px rgba(99,102,241,0); }
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px; font-weight: 700;
    background: linear-gradient(90deg, #f1f5f9, #a5b4fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .nav-links { display: flex; align-items: center; gap: 6px; }
  .nav-link {
    padding: 8px 14px; border-radius: 7px; font-size: 13.5px; font-weight: 600;
    color: #94a3b8; text-decoration: none; cursor: pointer; transition: all 0.15s;
  }
  .nav-link:hover { background: #1a2332; color: #e2e8f0; }
  .nav-link.active { background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(34,211,238,0.15)); color: #f1f5f9; }
  .nav-avatar {
    width: 32px; height: 32px; border-radius: 50%; margin-left: 8px;
    background: #2563eb; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: white; object-fit: cover; overflow: hidden;
  }

  .card { background: #131a29; border: 1px solid #1e293b; border-radius: 14px; padding: 24px; margin-bottom: 18px; }
  h3 { font-size: 15px; font-weight: 600; color: #f1f5f9; margin: 0 0 4px 0; }
  .muted { color: #64748b; font-size: 12.5px; margin: 6px 0 16px 0; }

  label { display: block; margin-top: 14px; font-weight: 600; font-size: 12.5px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.4px; }
  input, select {
    width: 100%; padding: 10px 12px; margin-top: 5px;
    background: #0f1522; border: 1px solid #263145; border-radius: 8px;
    color: #e2e8f0; font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: #3b82f6; }
  input:disabled { color: #64748b; background: #0a0e17; }

  button {
    margin-top: 16px; padding: 10px 18px; border: none; border-radius: 8px;
    background: #2563eb; color: white; font-size: 13.5px; font-weight: 600;
    cursor: pointer; margin-right: 8px; font-family: inherit;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #1e293b; color: #cbd5e1; }
  button.secondary:hover { background: #263449; }

  .result { margin-top: 14px; padding: 14px 16px; background: #0f1e14; border-left: 3px solid #22c55e; border-radius: 8px; font-size: 13.5px; color: #d1e7d6; }
  .error { background: #250f12; border-left-color: #ef4444; color: #f3c4c4; }

  .photo-row { display: flex; align-items: center; gap: 20px; margin-top: 14px; }
  .photo-preview {
    width: 88px; height: 88px; border-radius: 50%; background: #1e293b;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #93c5fd; overflow: hidden; flex-shrink: 0;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  #photoInput { display: none; }
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">
    <div class="logo-badge">
      <div class="logo-core">
        <div class="logo-dot"></div>
      </div>
    </div>
    <span class="brand-name">DevPulse</span>
  </div>
  <div class="nav-links">
    <a class="nav-link" onclick="window.location.href='/dashboard/'">Dashboard</a>
    <a class="nav-link active">Profile</a>
    <div class="nav-avatar" id="navAvatar">?</div>
  </div>
</div>

<div class="card">
  <h3>Profile photo</h3>
  <p class="muted">Shown to your team wherever your name appears.</p>
  <div class="photo-row">
    <div class="photo-preview" id="photoPreview">?</div>
    <div>
      <input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto()">
      <button class="secondary" onclick="document.getElementById('photoInput').click()">Change photo</button>
      <div id="photoResult"></div>
    </div>
  </div>
</div>

<div class="card">
  <h3>Account details</h3>
  <p class="muted">This information is used across your teams and reports.</p>

  <label>Username</label>
  <input id="username" disabled>

  <label>Email</label>
  <input id="email" disabled>

  <label>Role</label>
  <input id="role" disabled>

  <label>Full name</label>
  <input id="fullName" placeholder="e.g. Jeffin C John">

  <div style="display:flex; gap:12px;">
    <div style="flex:1;">
      <label>Date of birth</label>
      <input id="dob" type="date">
    </div>
    <div style="flex:1;">
      <label>Age</label>
      <input id="age" disabled placeholder="auto-calculated">
    </div>
  </div>

  <label>Gender</label>
  <select id="gender">
    <option value="">Select...</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
    <option value="unspecified">Prefer not to say</option>
  </select>

  <label>GitHub username</label>
  <input id="githubUsername" placeholder="e.g. jeffincj">

  <button onclick="saveProfile()">Save changes</button>
  <div id="profileResult"></div>
</div>

<div class="card">
  <h3>Change password</h3>
  <p class="muted">You'll need your current password to set a new one.</p>
  <label>Current password</label>
  <input id="oldPassword" type="password">
  <label>New password</label>
  <input id="newPassword" type="password">
  <button onclick="changePassword()">Update password</button>
  <div id="passwordResult"></div>
</div>

<div class="card" id="feedbackCard" style="display:none;">
  <h3>💬 Feedback you've received</h3>
  <button onclick="loadReceivedFeedback()">Refresh</button>
  <div id="receivedFeedbackResult"></div>
</div>

<script>
const token = localStorage.getItem('devpulse_access');
if (!token) window.location.href = '/login/';

function headers(extra) { return Object.assign({ "Authorization": "Bearer " + token }, extra || {}); }
function showResult(id, text, isError) {
  document.getElementById(id).innerHTML = "<div class='result" + (isError ? " error" : "") + "'>" + text + "</div>";
}

function setAvatar(elId, photoUrl, initials) {
  const el = document.getElementById(elId);
  if (photoUrl) { el.innerHTML = `<img src="${photoUrl}">`; }
  else { el.textContent = initials || '?'; }
}

async function loadProfile() {
  try {
    const res = await fetch('/api/auth/me/', { headers: headers() });
    const data = await res.json();
    if (!res.ok) { window.location.href = '/login/'; return; }

    document.getElementById('username').value = data.username;
    document.getElementById('email').value = data.email || '';
    document.getElementById('role').value = data.profile.role;
    document.getElementById('fullName').value = data.profile.full_name || '';
    document.getElementById('dob').value = data.profile.date_of_birth || '';
    document.getElementById('age').value = data.profile.age !== null ? data.profile.age : '';
    document.getElementById('gender').value = data.profile.gender || '';
    document.getElementById('githubUsername').value = data.profile.github_username || '';

    const initials = (data.profile.full_name || data.username || '?').trim().charAt(0).toUpperCase();
    setAvatar('photoPreview', data.profile.photo_url, initials);
    setAvatar('navAvatar', data.profile.photo_url, initials);

    document.getElementById('feedbackCard').style.display = 'block';
    await loadReceivedFeedback();
  } catch (e) { console.error(e); }
}

async function uploadPhoto() {
  const fileInput = document.getElementById('photoInput');
  if (!fileInput.files.length) return;
  const formData = new FormData();
  formData.append('photo', fileInput.files[0]);
  showResult('photoResult', 'Uploading...');
  try {
    const res = await fetch('/api/auth/upload-photo/', {
      method: 'POST',
      headers: { "Authorization": "Bearer " + token },
      body: formData
    });
    const data = await res.json();
    if (!res.ok) { showResult('photoResult', 'Upload failed: ' + JSON.stringify(data), true); return; }
    setAvatar('photoPreview', data.photo_url);
    setAvatar('navAvatar', data.photo_url);
    showResult('photoResult', '✅ Photo updated.');
  } catch (e) { showResult('photoResult', 'Error: ' + e, true); }
}

async function saveProfile() {
  const body = {
    profile: {
      full_name: document.getElementById('fullName').value,
      date_of_birth: document.getElementById('dob').value || null,
      gender: document.getElementById('gender').value,
      github_username: document.getElementById('githubUsername').value,
    }
  };
  try {
    const res = await fetch('/api/auth/me/', {
      method: 'PATCH',
      headers: headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) { showResult('profileResult', 'Could not save: ' + JSON.stringify(data), true); return; }
    document.getElementById('age').value = data.profile.age !== null ? data.profile.age : '';
    showResult('profileResult', '✅ Profile updated.');
  } catch (e) { showResult('profileResult', 'Error: ' + e, true); }
}

async function changePassword() {
  const old_password = document.getElementById('oldPassword').value;
  const new_password = document.getElementById('newPassword').value;
  if (!old_password || !new_password) { showResult('passwordResult', 'Fill in both fields.', true); return; }
  try {
    const res = await fetch('/api/auth/change-password/', {
      method: 'POST',
      headers: headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ old_password, new_password })
    });
    const data = await res.json();
    if (!res.ok) { showResult('passwordResult', JSON.stringify(data.detail || data), true); return; }
    document.getElementById('oldPassword').value = '';
    document.getElementById('newPassword').value = '';
    showResult('passwordResult', '✅ Password updated successfully.');
  } catch (e) { showResult('passwordResult', 'Error: ' + e, true); }
}

async function loadReceivedFeedback() {
  try {
    const res = await fetch('/api/feedback/received/', { headers: headers() });
    const data = await res.json();
    const items = data.results || data;
    if (!items.length) { showResult('receivedFeedbackResult', 'No feedback received yet.'); return; }
    let text = '';
    items.forEach(f => {
      text += `From ${f.sender_username}` + (f.repository_name ? ` (about ${f.repository_name})` : '') + `:\n"${f.message}"\n\n`;
    });
    document.getElementById('receivedFeedbackResult').innerHTML = "<div class='result'>" + text.replace(/\n/g, '<br>') + "</div>";
  } catch (e) { showResult('receivedFeedbackResult', 'Error: ' + e, true); }
}

loadProfile();
</script>

</body>
</html>
